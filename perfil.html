<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil - RobinHub</title>
    <style>
        :root { 
            --primary: #1b8246; 
            --accent: #2ecc71;
            --light-green: #e8f5e9;
            --sidebar-width: 300px;
            /* Variables para el Modo Claro/Oscuro */
            --bg-card: #ffffff;
            --text-main: #2c3e50;
            --text-secondary: #777777;
            --nav-bottom-bg: var(--light-green);
            --sidebar-bg: rgba(255, 255, 255, 0.98);
            --overlay: rgba(255, 255, 255, 0.4);
        }

        [data-theme="dark"] {
            --bg-card: #1a1a1a;
            --text-main: #f0f0f0;
            --text-secondary: #bbbbbb;
            --nav-bottom-bg: #0d3d21;
            --sidebar-bg: rgba(20, 20, 20, 0.98);
            --overlay: rgba(0, 0, 0, 0.6);
        }

        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background-image: url('claro.png'); 
            background-size: 100% auto; background-repeat: repeat-y; 
            background-attachment: scroll; overflow-x: hidden;
        }

        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay); z-index: -1; pointer-events: none;
            transition: background 0.5s ease;
        }

        /* --- HEADER --- */
        header { position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .nav-top { background: var(--primary); height: 75px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; }
        .nav-bottom { 
            background: var(--nav-bottom-bg); height: 60px; 
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 5% 0 150px; border-bottom: 4px solid var(--accent);
            transition: background 0.5s ease;
        }

        .brand-text-bottom {
            color: var(--primary); font-size: 32px; font-weight: 800;
            margin-left: 40px; letter-spacing: -1px; pointer-events: none; user-select: none;
        }

        .consejo-texto { color: var(--primary); font-size: 15px; font-weight: 600; font-style: italic; }

        /* --- GRID Y CONTROLES --- */
        .controls-wrapper { display: flex; align-items: center; gap: 15px; flex-grow: 1; margin-left: 100px; }
        .back-link { text-decoration: none; color: white; font-weight: bold; font-size: 14px; display: inline-block; }
        .profile-header {
            background: var(--bg-card);
            padding: 40px 32px;
            border-bottom: 1px solid #ddd;
            color: var(--text-main);
            max-width: 1040px;
            margin: 20px auto 0;
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.08);
        }
        .profile-hero {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 26px;
            align-items: center;
            text-align: left;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
        }
        .profile-main {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .profile-main-top {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .profile-main h1 {
            margin: 0;
            font-size: 2.4rem;
        }
        .cv-toggle {
            width: 52px;
            height: 52px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            border: 1px solid rgba(27,130,70,0.22);
            background: var(--bg-card);
            color: var(--primary);
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }
        .cv-toggle:hover {
            background: rgba(27,130,70,0.08);
        }
        .profile-main p {
            margin: 0;
            line-height: 1.7;
            max-width: 780px;
        }
        .links-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        .links-row .link-card { background: rgba(27,130,70,0.08); color: var(--primary); padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(27,130,70,0.2); display: inline-flex; align-items: center; gap: 6px; }
        .link-card:hover { transform: none; box-shadow: none; }
        .link-card a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .profile-hero { display: grid; grid-template-columns: 150px minmax(320px,1fr) 180px; gap: 24px; align-items: start; }
        .profile-skill-stack { display: grid; gap: 10px; justify-self: end; }
        .skill-stack { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
        .skill-stack .skill-badge { width: max-content; padding: 10px 14px; border-radius: 999px; background: rgba(27,130,70,0.08); border: 1px solid rgba(27,130,70,0.22); }
        .profile-row { display: grid; gap: 22px; margin-top: 30px; }
        .studies-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .study-card { background: var(--bg-card); padding: 16px; border-radius: 16px; border: 1px solid rgba(27,130,70,0.15); box-shadow: 0 1px 10px rgba(0,0,0,0.05); }
        .study-card strong { color: var(--primary); font-size: 15px; }
        .study-card p { margin: 6px 0 0; color: var(--text-secondary); font-size: 14px; }
        .popover-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6000;
            padding: 18px;
        }
        .popover-modal[hidden] { display: none; }
        .popover-card {
            width: min(480px, 100%);
            max-height: 80vh;
            background: var(--bg-card);
            border-radius: 18px;
            overflow-y: auto;
            padding: 18px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.28);
            position: relative;
        }
        .popover-card h4 {
            margin: 0 0 14px;
            color: var(--primary);
            font-size: 1.05rem;
        }
        .popover-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            color: var(--primary);
            font-size: 18px;
            cursor: pointer;
        }
        .popover-items { display: grid; gap: 12px; }
        .popover-item { background: rgba(27,130,70,0.08); padding: 12px 14px; border-radius: 14px; color: var(--text-main); }
        .popover-item a { word-break: break-word; }
        .skill-stack .skill-badge { width: max-content; padding: 10px 14px; border-radius: 999px; background: rgba(27,130,70,0.08); border: 1px solid rgba(27,130,70,0.22); }
        .profile-row { display: grid; gap: 22px; margin-top: 30px; }
        .studies-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .study-card { background: var(--bg-card); padding: 16px; border-radius: 16px; border: 1px solid rgba(27,130,70,0.15); box-shadow: 0 1px 10px rgba(0,0,0,0.05); }
        .study-card strong { color: var(--primary); font-size: 15px; }
        .study-card p { margin: 6px 0 0; color: var(--text-secondary); font-size: 14px; }
        .cv-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5000;
            padding: 20px;
        }
        .cv-modal[hidden] { display: none; }
        .cv-modal-content {
            width: min(960px, 100%);
            max-height: 90vh;
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 18px 40px rgba(0,0,0,0.3);
        }
        .cv-modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            color: var(--primary);
            font-size: 18px;
            cursor: pointer;
            z-index: 2;
        }
        .cv-modal embed {
            width: 100%;
            height: 85vh;
            display: block;
        }
        .profile-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: flex-start;
            margin-top: 28px;
        }
        .btn-edit{
            background: linear-gradient(180deg,#2ea86a,#1b8246);
            color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 18px rgba(27,130,70,0.12);
            transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
        }
        .btn-edit:hover{ transform: translateY(-2px); box-shadow: 0 14px 30px rgba(27,130,70,0.18); }
        .btn-edit.saving{ background: linear-gradient(180deg,#ffd54d,#ffb300); color:#2b2b2b; }

        /* Inline edit controls */
        #inlineControls { background: rgba(27,130,70,0.03); border: 1px solid rgba(27,130,70,0.06); padding: 12px; border-radius: 12px; margin-top: 14px; }
        #inlineControls input, #inlineControls textarea { background: transparent; border: 1px solid rgba(27,130,70,0.12); }
        #inlineControls .add-btn { padding: 8px 10px; font-size: 13px; }

        /* Skill badges in edit mode */
        .skill-badge { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; background: linear-gradient(180deg, rgba(27,130,70,0.08), rgba(27,130,70,0.03)); border:1px solid rgba(27,130,70,0.12); font-weight:600; }
        .skill-badge button{ background: transparent; border: none; color: rgba(0,0,0,0.5); cursor: pointer; font-weight:700; margin-left:6px; }

        /* Link cards */
        .link-card { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; background: linear-gradient(180deg, rgba(20,120,60,0.06), rgba(20,120,60,0.02)); border:1px solid rgba(27,130,70,0.08); }
        .link-card a { font-weight:600; color: var(--primary); }
        .link-card button{ background: transparent; border: none; color: rgba(0,0,0,0.45); cursor:pointer; font-weight:700; }

        /* Inputs and textareas for inline edit */
        #inlineName, #inlineBio, #inlineSkillInput, #inlineLinkInput, #inlineStudyInstitution, #inlineStudyDegree, #inlineStudyYear { border: 1px solid rgba(27,130,70,0.12); padding:8px; border-radius:8px; }
        #inlineName { font-size: 1.6rem; font-weight:700; }
        textarea#inlineBio { min-height: 80px; }

        /* Small responsive tweak */
        @media (max-width: 900px) {
            #inlineControls { padding: 10px; }
            .profile-hero { grid-template-columns: 120px 1fr; gap:14px; }
        }
        .profile-actions .btn-folder { min-width: 180px; }
        @media (max-width: 900px) {
            .profile-hero { grid-template-columns: 1fr; text-align: center; }
            .profile-main { align-items: center; }
            .profile-skill-stack { justify-self: center; }
            .profile-row { grid-template-columns: 1fr; }
            .profile-actions { justify-content: center; }
        }
        @media (max-width: 640px) {
            .profile-header { padding: 28px 18px; }
            .profile-row { gap: 16px; }
        }

        /* Botones con forma de carpeta */
        .btn-folder {
            --folder-bg: var(--primary);
            position: relative;
            background: var(--folder-bg);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 18px rgba(27,130,70,0.12);
        }

        .btn-folder::before {
            content: "";
            position: absolute;
            left: 12px;
            top: -10px;
            width: 46px;
            height: 18px;
            background: rgba(255,255,255,0.09);
            border-radius: 4px 6px 0 0;
            transform: translateY(0);
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.04);
        }

        .btn-folder.primary { background: var(--primary); }
        .btn-folder.chats { background: linear-gradient(180deg, var(--primary), #15713a); }

        .btn-folder .title { text-align: center; display: inline-block; min-width: 80px; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); border-radius: 10px; overflow: hidden; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: var(--text-main); }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card-info { padding: 10px; }

        .chat-card {
            background: var(--bg-card);
            border: 1px solid rgba(27,130,70,0.12);
            border-radius: 22px;
            padding: 18px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.08);
        }

        .chat-card h4 {
            margin: 0 0 10px 0;
            color: var(--primary);
        }

        .chat-card p {
            margin: 6px 0;
            color: var(--text-secondary);
        }

        .chat-request-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .chat-request-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chat-list { display: grid; gap: 16px; }

        .chat-summary {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .chat-status { color: var(--primary); font-weight: 700; }

        /* --- LOGO SAGRADO --- */
        .header-left { position: relative; display: flex; align-items: center; }
        .logo-arquero {
            width: 145px; height: auto; cursor: pointer; z-index: 3000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25));
            position: absolute; top: -35px; left: 0;
        }

        /* --- FLECHA --- */
        .flecha-container {
            position: absolute; left: 75px; top: -18px;
            width: 80px; height: 50px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; opacity: 0; pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2500;
        }
        .flecha { width: 50px; height: 4px; background: #ffffff; box-shadow: 0 0 8px white; border-radius: 2px; position: relative; }
        .flecha::after { content: ''; position: absolute; right: -2px; top: -5px; border-left: 14px solid white; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
        .menu-open .flecha-container { opacity: 1; left: calc(var(--sidebar-width) - 40px); pointer-events: auto; }

        /* --- SIDEBAR IZQUIERDA --- */
        .sidebar {
            height: 100%; width: var(--sidebar-width); position: fixed; top: 0; left: calc(var(--sidebar-width) * -1);
            background: var(--sidebar-bg); backdrop-filter: blur(15px); z-index: 2000;
            transition: 0.5s; box-shadow: 8px 0 30px rgba(0,0,0,0.15); padding-top: 150px;
        }
        .menu-open .sidebar { left: 0; }
        .sidebar a { padding: 18px 35px; text-decoration: none; font-size: 18px; color: var(--text-main); display: block; font-weight: 700; transition: 0.3s; cursor: pointer; }
        .sidebar a:hover { background: var(--light-green); color: var(--primary); transform: translateX(10px); }

        .submenu { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: rgba(0, 0, 0, 0.05); }
        .submenu-active { max-height: 500px; }
        .submenu a { padding: 12px 50px; font-size: 15px; opacity: 0.8; }

        .edit-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: min(360px, 100%);
            height: 100vh;
            overflow-y: auto;
            background: var(--bg-card);
            box-shadow: -14px 0 40px rgba(0,0,0,0.16);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 3000;
            padding: 24px;
        }
        .edit-panel.active {
            transform: translateX(0);
        }
        .edit-panel h3 {
            margin: 0 0 18px;
            color: var(--primary);
            font-size: 22px;
        }
        .edit-panel .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: transparent;
            border: none;
            font-size: 24px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .edit-panel #editList {
            display: grid;
            gap: 12px;
            margin-top: 18px;
        }
[data-theme="dark"] {
    --bg-card: #1a1a1a;
    --text-main: #f0f0f0;
    --light-green: #0d3d21; /* Verde muy oscuro para el fondo del nav-bottom */
}

/* Aplicación del fondo oscuro al overlay */
[data-theme="dark"] body::after {
    background: var(--overlay) !important;
}

/* Si tienes tarjetas de sugerencias o publicar, añade esto para que cambien de color */
[data-theme="dark"] .sugerencia-card, 
[data-theme="dark"] .publicar-container,
[data-theme="dark"] .ajustes-card {
    background: var(--bg-card) !important;
    color: var(--text-main) !important;
    border-color: rgba(255,255,255,0.1);
}


    </style>
</head>
<body id="bodyTag">

<div id="editPanel" class="edit-panel" hidden>
    <button class="close-btn" onclick="toggleEditPanel()">✕</button>
    <h3>Editar ajustes rápidos</h3>
    <div id="editList"></div>
</div>

<header>
    <div class="nav-top">
        <div class="header-left">
            <img src="182 sin título_20260415212120.png" class="logo-arquero" onclick="toggleMenu()">

            <div class="profile-main-top">

<script type="module">
    import { db, auth } from "./firebase.js";
    import { addDoc, collection, doc, getDoc, getDocs, orderBy, query, serverTimestamp, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { applySavedTheme, toggleTheme, toggleMenu, toggleSubmenu, loadMenuConfig, setupSidebar, createEditPanel, renderSubmenu } from "./shared/common.js";

    // --- CONSEJOS ALEATORIOS ---
    const tips = [
        "Los perfiles completos atraen más colaboradores.",
        "Comparte tu visión y tus objetivos.",
        "Un buen perfil es tu carta de presentación.",
        "Actualiza tu información regularmente.",
        "La transparencia genera confianza."
    ];
    document.getElementById("randomTip").textContent = tips[Math.floor(Math.random() * tips.length)];

    const menuConfig = loadMenuConfig();
    window.toggleMenu = toggleMenu;
    window.toggleSubmenu = toggleSubmenu;
    window.toggleTheme = toggleTheme;
    window.toggleEditPanel = () => {
        const panel = document.getElementById('editPanel');
        if (!panel) return;
        const active = panel.classList.toggle('active');
        panel.hidden = !active;
    };

    function renderMenuConfig() {
        renderSubmenu({
            config: menuConfig,
            onEdit: window.toggleEditPanel,
            onMore: () => window.location.href = 'ajustes.html',
            onTheme: toggleTheme
        });
        createEditPanel(menuConfig, 'editList', renderMenuConfig);
    }

    applySavedTheme();
    renderMenuConfig();

    const viewUid = new URLSearchParams(window.location.search).get("uid");
    let userProjects = [];

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }

        setupSidebar({
            config: menuConfig,
            onPerfil: () => { window.location.href = `perfil.html?uid=${user.uid}`; },
            onLogout: async () => {
                await signOut(auth);
                window.location.href = 'RobinHub.html';
            },
            onEdit: window.toggleEditPanel,
            onMore: () => window.location.href = 'ajustes.html'
        });
        renderMenuConfig();

        const targetUid = viewUid || user.uid;

        // Mostrar botón editar solo si es MI perfil
        if (user.uid === targetUid) document.getElementById("editBtn").style.display = "inline-block";

        // Cargar datos
        const userDoc = await getDoc(doc(db, "users", targetUid));
        if (userDoc.exists()) {
            const d = userDoc.data();
            window.currentProfile = d;
            document.getElementById("user-name").textContent = d.nombre || "Usuario";
            document.getElementById("user-bio").textContent = d.bio || "Sin descripción";
            if (d.foto) document.getElementById("user-img").src = d.foto;

            let hasRowInfo = false;
            const skillStack = document.getElementById("skillsList");
            const profileSkillStack = document.querySelector(".profile-skill-stack");
            const linksRow = document.getElementById("linksRow");
            const profileRow = document.getElementById("profile-row");
            const cvToggle = document.getElementById("cvToggle");
            const cvModal = document.getElementById("cvModal");
            const cvEmbed = document.getElementById("cvEmbed");
            const cvClose = document.getElementById("cvClose");
            const popoverModal = document.getElementById("popoverModal");
            const popoverClose = document.getElementById("popoverClose");
            const popoverTitle = document.getElementById("popoverTitle");
            const popoverItems = document.getElementById("popoverItems");

            // Mostrar habilidades en columna superior derecha
            if (d.habilidades && d.habilidades.length > 0) {
                const visibleSkills = d.habilidades.slice(0, 4);
                const extraSkills = d.habilidades.slice(4);
                skillStack.innerHTML = visibleSkills.map(skill =>
                    `<div class="skill-badge">${skill}</div>`
                ).join("");
                if (extraSkills.length) {
                    window.profileOverflowData = window.profileOverflowData || {};
                    window.profileOverflowData.habilidades = extraSkills;
                    skillStack.innerHTML += `<div class="skill-badge" style="cursor:pointer; background: rgba(27,130,70,0.12); border-color: rgba(27,130,70,0.3);" onclick="window.showPopover('Habilidades', window.profileOverflowData.habilidades)">y más</div>`;
                }
                profileSkillStack.style.display = "grid";
            }

            // Mostrar enlaces como etiquetas debajo de la bio
            if (d.enlaces && d.enlaces.length > 0) {
                const visibleLinks = d.enlaces.slice(0, 3);
                const extraLinks = d.enlaces.slice(3);
                linksRow.innerHTML = visibleLinks.map(link => {
                    const displayName = link.nombre.length > 17 ? link.nombre.slice(0, 17) + '…' : link.nombre;
                    return `<div class="link-card"><a title="${link.nombre}" href="${link.url}" target="_blank" rel="noopener noreferrer">${displayName}</a></div>`;
                }).join("");
                if (extraLinks.length) {
                    window.profileOverflowData = window.profileOverflowData || {};
                    window.profileOverflowData.enlaces = extraLinks;
                    linksRow.innerHTML += `<div class="link-card" style="cursor:pointer; background: rgba(27,130,70,0.12); border-color: rgba(27,130,70,0.3);" onclick="window.showPopover('Enlaces', window.profileOverflowData.enlaces)">y más</div>`;
                }
                linksRow.style.display = "flex";
            }

            // Mostrar estudios en la fila inferior
            if (d.estudios && d.estudios.length > 0) {
                const visibleStudies = d.estudios.slice(0, 3);
                const extraStudies = d.estudios.slice(3);
                const studiesList = document.getElementById("studiesList");
                studiesList.innerHTML = visibleStudies.map(study =>
                    `<div class="study-card">
                        <strong>${study.degree}</strong>
                        <p>${study.institution}</p>
                        <p style="font-size: 12px; color: var(--text-secondary);">Finalizado: ${study.year}</p>
                    </div>`
                ).join("");
                if (extraStudies.length) {
                    window.profileOverflowData = window.profileOverflowData || {};
                    window.profileOverflowData.estudios = extraStudies;
                    studiesList.innerHTML += `<div class="study-card" style="cursor:pointer; background: rgba(27,130,70,0.08); border-color: rgba(27,130,70,0.3);" onclick="window.showPopover('Estudios', window.profileOverflowData.estudios)"><strong>y más</strong><p>Ver las demás fichas</p></div>`;
                }
                document.getElementById("studiesSection").style.display = "block";
                profileRow.style.display = "grid";
            }

            // Mostrar botón CV como ventana emergente
            if (d.cv && d.cv.length > 0) {
                cvToggle.style.display = "inline-flex";
                cvToggle.onclick = () => {
                    cvEmbed.src = d.cv;
                    cvModal.hidden = false;
                };
                cvClose.onclick = () => {
                    cvModal.hidden = true;
                };
                cvModal.onclick = (event) => {
                    if (event.target === cvModal) cvModal.hidden = true;
                };
            }

            popoverClose.onclick = () => {
                popoverModal.hidden = true;
            };

            popoverModal.onclick = (event) => {
                if (event.target === popoverModal) popoverModal.hidden = true;
            };

            window.showPopover = function(title, items) {
                popoverTitle.textContent = title;
                popoverItems.innerHTML = items.map(item => {
                    if (title === 'Enlaces') {
                        return `<div class="popover-item"><a href="${item.url}" target="_blank" rel="noopener noreferrer" style="color: var(--primary); text-decoration: none;">${item.nombre}</a></div>`;
                    }
                    if (title === 'Habilidades') {
                        return `<div class="popover-item">${item}</div>`;
                    }
                    if (title === 'Estudios') {
                        return `<div class="popover-item"><strong>${item.degree}</strong><div style="font-size: 13px; color: var(--text-secondary);">${item.institution} • ${item.year}</div></div>`;
                    }
                    return `<div class="popover-item">${item}</div>`;
                }).join('');
                popoverModal.hidden = false;
            };
        }

        // Cargar proyectos
        const q = query(collection(db, "proyectos"), where("userId", "==", targetUid));
        const snap = await getDocs(q);
        const box = document.getElementById("user-projects");
        box.innerHTML = '';
        userProjects = [];
        snap.forEach(d => {
            const p = d.data();
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `<img src="${p.imagen}"><div class="card-info"><h4>${p.titulo}</h4></div>`;
            card.onclick = () => location.href = `proyecto.html?id=${d.id}`;
            box.appendChild(card);
            userProjects.push(d.id);
        });
        // Controls: show folder buttons only for my profile, otherwise show projects
        const btnMyProjects = document.getElementById('btnMyProjects');
        const btnChats = document.getElementById('btnChats');
        const projectsSection = document.getElementById('projectsSection');

        if (user.uid === targetUid) {
            // Profile owner: show controls, hide sections by default
            document.getElementById("editBtn").style.display = "inline-block";
            btnMyProjects.style.display = 'inline-block';
            btnChats.style.display = 'inline-block';
            projectsSection.style.display = 'none';
            document.getElementById('requestSection').style.display = 'none';
            document.getElementById('myChatsSection').style.display = 'none';

            btnMyProjects.onclick = () => {
                const isVisible = projectsSection.style.display === 'block';
                projectsSection.style.display = isVisible ? 'none' : 'block';
                // hide chats when showing projects
                if (!isVisible) {
                    document.getElementById('requestSection').style.display = 'none';
                    document.getElementById('myChatsSection').style.display = 'none';
                }
            };

            btnChats.onclick = async () => {
                // snapshot my projects to localStorage
                try { localStorage.setItem('myProjectsSnapshot', JSON.stringify(userProjects || [])); } catch (e) {}
                await loadChatRequests(targetUid);
                await loadUserChats(targetUid);
                document.getElementById('requestSection').style.display = 'block';
                document.getElementById('myChatsSection').style.display = 'block';
                projectsSection.style.display = 'none';
            };

            // Mostrar solicitudes y chats al cargar el propio perfil
            await loadChatRequests(targetUid);
            await loadUserChats(targetUid);
            document.getElementById('requestSection').style.display = 'block';
            document.getElementById('myChatsSection').style.display = 'block';
            projectsSection.style.display = 'none';

        } else {
            // Viewing someone else's profile: show projects, hide chats and controls
            btnMyProjects.style.display = 'none';
            btnChats.style.display = 'none';
            projectsSection.style.display = 'block';
            document.getElementById('requestSection').style.display = 'none';
            document.getElementById('myChatsSection').style.display = 'none';
        }
    });

    async function loadChatRequests(uid) {
        const q = query(collection(db, 'chatRequests'), where('toUid', '==', uid), where('status', '==', 'pending'));
        const snap = await getDocs(q);
        const requests = [];
        snap.forEach(docReq => requests.push({ id: docReq.id, ...docReq.data() }));
        requests.sort((a, b) => {
            const aTs = a.createdAt?.toDate?.() || new Date(0);
            const bTs = b.createdAt?.toDate?.() || new Date(0);
            return bTs - aTs;
        });

        const container = document.getElementById('chatRequests');
        container.innerHTML = '';

        requests.forEach(req => {
            const card = document.createElement('div');
            card.className = 'chat-card';
            card.innerHTML = `
                <div class="chat-request-meta">
                    <div><strong>${req.fromName || 'Usuario'}</strong> solicitó chat por <strong>${req.projectTitle || 'un proyecto'}</strong></div>
                    <div class="chat-status">Pendiente</div>
                </div>
                <p>${req.message}</p>
                <div class="chat-request-actions">
                    <button class="btn-action" id="accept-${req.id}">Aceptar</button>
                    <button class="btn-danger" id="reject-${req.id}">Rechazar</button>
                </div>
            `;

            container.appendChild(card);

            document.getElementById(`accept-${req.id}`).onclick = async () => {
                await acceptChatRequest(req.id, req);
                await loadChatRequests(uid);
                await loadUserChats(uid);
            };
            document.getElementById(`reject-${req.id}`).onclick = async () => {
                await rejectChatRequest(req.id);
                await loadChatRequests(uid);
            };
        });
    }

    async function loadUserChats(uid) {
        const q = query(collection(db, 'chats'), where('participants', 'array-contains', uid));
        const snap = await getDocs(q);
        const chats = [];
        snap.forEach(chatDoc => chats.push({ id: chatDoc.id, ...chatDoc.data() }));
        chats.sort((a, b) => {
            const aTs = a.lastMessageAt?.toDate?.() || new Date(0);
            const bTs = b.lastMessageAt?.toDate?.() || new Date(0);
            return bTs - aTs;
        });

        const container = document.getElementById('chatList');
        container.innerHTML = '';

        for (const chat of chats) {
            const otherUid = (chat.participants || []).find(id => id !== uid) || uid;
            const otherDoc = await getDoc(doc(db, 'users', otherUid));
            const otherName = otherDoc.exists() ? otherDoc.data().nombre || 'Usuario' : 'Usuario';

            const card = document.createElement('div');
            card.className = 'chat-card';
            card.innerHTML = `
                <div class="chat-request-meta">
                    <div><strong>Chat con ${otherName}</strong></div>
                    <div class="chat-status">${chat.projectTitle || 'Conversación'}</div>
                </div>
                <p>${chat.lastMessage || 'Sin mensajes aún'}</p>
                <div class="chat-summary">Última vez: ${chat.lastMessageAt ? new Date(chat.lastMessageAt.toDate()).toLocaleString() : 'No hay actividad'}</div>
            `;
            card.onclick = () => location.href = `chat.html?chatId=${chat.id}`;
            container.appendChild(card);
        }
    }

    async function acceptChatRequest(requestId, req) {
        const chatRef = await addDoc(collection(db, 'chats'), {
            participants: [req.fromUid, req.toUid],
            projectId: req.projectId || null,
            projectTitle: req.projectTitle || null,
            createdAt: serverTimestamp(),
            lastMessage: req.message || 'Solicitud aceptada',
            lastMessageAt: serverTimestamp(),
        });

        await updateDoc(doc(db, 'chatRequests', requestId), {
            status: 'accepted',
            chatId: chatRef.id,
        });

        await addDoc(collection(db, 'chats', chatRef.id, 'messages'), {
            senderId: req.fromUid,
            text: req.message || 'Hola, quisiera conversar contigo.',
            createdAt: serverTimestamp(),
            type: 'request',
        });

        alert('Solicitud aceptada. Se ha creado el chat y estará disponible en tu perfil.');
    }

    async function rejectChatRequest(requestId) {
        await updateDoc(doc(db, 'chatRequests', requestId), {
            status: 'rejected',
        });
        alert('Solicitud rechazada.');
    }
    
    // --- MODO EDICIÓN INLINE (sin panel lateral) ---
    (function(){
        let inlineEditing = false;
        let inlineSkills = [];
        let inlineLinks = [];
        let inlineStudies = [];
        let inlinePhoto = null;
        let inlineCv = null;

        window.toggleInlineEditMode = async function(){
            const btn = document.getElementById('editBtn');
            const nameEl = document.getElementById('user-name');
            const bioEl = document.getElementById('user-bio');
            const imgEl = document.getElementById('user-img');
            const linksRow = document.getElementById('linksRow');
            const skillsList = document.getElementById('skillsList');
            const studiesList = document.getElementById('studiesList');

            if(!inlineEditing){
                // activar modo edición
                inlineEditing = true;
                btn.textContent = 'Guardar cambios';

                const profile = window.currentProfile || {};
                inlineSkills = (profile.habilidades || []).slice();
                inlineLinks = (profile.enlaces || []).slice();
                inlineStudies = (profile.estudios || []).slice();
                inlinePhoto = profile.foto || null;
                inlineCv = profile.cv || null;

                // name -> input
                const curName = profile.nombre || nameEl.textContent || '';
                nameEl.innerHTML = `<input id="inlineName" maxlength="20" style="font-size:1.8rem;padding:6px;border-radius:6px;" value="${escapeHtml(curName)}">`;
                // bio -> textarea (clickable to edit)
                const curBio = profile.bio || bioEl.textContent || '';
                bioEl.innerHTML = `<textarea id="inlineBio" style="width:100%;min-height:80px;padding:8px;border-radius:8px;">${escapeHtml(curBio)}</textarea>`;

                // make image clickable to change
                imgEl.style.cursor = 'pointer';
                if(!document.getElementById('photoInputInline')){
                    const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.id='photoInputInline'; inp.style.display='none'; document.body.appendChild(inp);
                    inp.addEventListener('change', function(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ inlinePhoto=ev.target.result; imgEl.src=inlinePhoto; }; r.readAsDataURL(f); });
                }
                imgEl.addEventListener('click', triggerPhotoInput);

                // cv input
                if(!document.getElementById('cvInputInline')){
                    const c = document.createElement('input'); c.type='file'; c.accept='.pdf'; c.id='cvInputInline'; c.style.display='none'; document.body.appendChild(c);
                    c.addEventListener('change', function(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ inlineCv=ev.target.result; }; r.readAsDataURL(f); });
                }

                // render skill/link/study edit UI
                renderInlineSkills();
                renderInlineLinks();
                renderInlineStudies();

                // inject small controls area (if not exists)
                if(!document.getElementById('inlineControls')){
                    const c = document.createElement('div'); c.id='inlineControls'; c.style.marginTop='12px';
                    c.innerHTML = `
                        <div style="display:flex;gap:8px;margin-bottom:8px;"><input id="inlineSkillInput" maxlength="20" placeholder="Añadir habilidad" style="flex:1;padding:8px;border-radius:8px;"> <button class="add-btn" type="button" onclick="(function(){ const v=document.getElementById('inlineSkillInput').value.trim(); if(!v) return; inlineSkills.push(v); document.getElementById('inlineSkillInput').value=''; renderInlineSkills(); })()">+ Añadir</button></div>
                        <div style="display:flex;gap:8px;margin-bottom:8px;"><input id="inlineLinkInput" placeholder="Añadir URL" style="flex:1;padding:8px;border-radius:8px;"> <button class="add-btn" type="button" onclick="(function(){ const u=document.getElementById('inlineLinkInput').value.trim(); if(!u) return; try{ new URL(u);}catch{alert('URL inválida');return;} const hn=new URL(u).hostname.replace('www.',''); let nombre=hn.charAt(0).toUpperCase()+hn.slice(1); if(nombre.length>20) nombre=nombre.slice(0,20); inlineLinks.push({url:u,nombre:nombre}); document.getElementById('inlineLinkInput').value=''; renderInlineLinks(); })()">+ Enlace</button></div>
                        <div style="display:flex;gap:8px;margin-bottom:8px;"><input id="inlineStudyInstitution" placeholder="Institución" style="flex:1;padding:8px;border-radius:8px;"><input id="inlineStudyDegree" placeholder="Grado" style="flex:1;padding:8px;border-radius:8px;"><input id="inlineStudyYear" type="number" placeholder="Año" style="width:96px;padding:8px;border-radius:8px;"><button class="add-btn" type="button" onclick="(function(){ const inst=document.getElementById('inlineStudyInstitution').value.trim(); const deg=document.getElementById('inlineStudyDegree').value.trim(); const year=document.getElementById('inlineStudyYear').value; if(!inst||!deg||!year){alert('Completa campos');return;} inlineStudies.push({institution:inst,degree:deg,year:year}); document.getElementById('inlineStudyInstitution').value=''; document.getElementById('inlineStudyDegree').value=''; document.getElementById('inlineStudyYear').value=''; renderInlineStudies(); })()">+ Añadir</button></div>
                    `;
                    const parent = document.querySelector('.profile-main'); parent.appendChild(c);
                }

            } else {
                // salir y guardar
                const name = (document.getElementById('inlineName')||{}).value?.trim() || '';
                const bio = (document.getElementById('inlineBio')||{}).value?.trim() || '';
                if(!name){ alert('El nombre es requerido'); return; }
                if(name.length>20){ alert('El nombre no puede exceder 20 caracteres'); return; }
                try{
                    const user = auth.currentUser; if(!user){ alert('No autenticado'); return; }
                    await updateDoc(doc(db,'users',user.uid),{
                        nombre: name,
                        bio: bio,
                        foto: inlinePhoto || window.currentProfile?.foto || ('https://ui-avatars.com/api/?name='+encodeURIComponent(name)),
                        habilidades: inlineSkills,
                        enlaces: inlineLinks,
                        estudios: inlineStudies,
                        cv: inlineCv || window.currentProfile?.cv || '',
                        actualizadoEn: new Date()
                    });
                    // recargar para reflejar cambios (sencillo y seguro)
                    window.location.reload();
                }catch(err){ alert('Error guardando: '+err.message); }
            }
        };

        function triggerPhotoInput(){ const inp=document.getElementById('photoInputInline'); if(inp) inp.click(); }

        function renderInlineSkills(){ const el=document.getElementById('skillsList'); if(!el) return; el.innerHTML = inlineSkills.map((s,i)=>`<div class="skill-badge">${escapeHtml(s)} <button type="button" onclick="(function(i){ inlineSkills.splice(i,1); renderInlineSkills(); })(${i})">✕</button></div>`).join(''); }
        function renderInlineLinks(){ const el=document.getElementById('linksRow'); if(!el) return; el.style.display='flex'; el.innerHTML = inlineLinks.map((l,i)=>{ const display = (l.nombre||new URL(l.url).hostname).length>17 ? (l.nombre||new URL(l.url).hostname).slice(0,17)+'…' : (l.nombre||new URL(l.url).hostname); return `<div class="link-card"> <a href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(l.nombre||l.url)}">${escapeHtml(display)}</a> <button type="button" onclick="(function(i){ inlineLinks.splice(i,1); renderInlineLinks(); })(${i})">✕</button> <button type="button" onclick="(function(i){ const newName=prompt('Editar nombre:', inlineLinks[i].nombre||''); if(newName===null) return; const t=newName.trim(); if(!t) return; if(t.length>20){ alert('Máx 20 caracteres'); return; } inlineLinks[i].nombre=t; renderInlineLinks(); })( ${i} )">✎</button></div>`; }).join(''); }
        function renderInlineStudies(){ const el=document.getElementById('studiesList'); if(!el) return; el.innerHTML = inlineStudies.map((s,i)=>`<div class="study-card"><strong>${escapeHtml(s.degree)}</strong><p>${escapeHtml(s.institution)}</p><p style="font-size:12px;color:var(--text-secondary);">Finalizado: ${escapeHtml(s.year)}</p><button type="button" onclick="(function(i){ inlineStudies.splice(i,1); renderInlineStudies(); })(${i})">✕</button></div>`).join(''); }

        function escapeHtml(str){ return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    })();
</script>
