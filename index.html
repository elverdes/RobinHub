<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RobinHub — Shell de Reproducción</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    html,body{height:100%;margin:0}
    #appFrame{width:100%;height:100vh;border:0;display:block}
    .shell-fallback-controls{
      position:fixed;right:12px;top:12px;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
      background:rgba(255,255,255,0.9);backdrop-filter:blur(4px);padding:10px 12px 12px;border-radius:12px;border:1px solid rgba(0,0,0,0.06)
    }
    #volumeControl, #shell-volume-control {
      -webkit-appearance:none;
      appearance:none;
      width: 100px;
      background: rgba(255,255,255,0.3);
      height: 4px;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }
    #volumeControl::-webkit-slider-thumb, #shell-volume-control::-webkit-slider-thumb {
      -webkit-appearance:none;
      appearance:none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      border: 2px solid #1db954;
      margin-top: -6px;
    }
    #volumeControl::-moz-range-thumb, #shell-volume-control::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      border: 2px solid #1db954;
      cursor: pointer;
    }
    #volumeControl::-moz-range-track, #shell-volume-control::-moz-range-track {
      background: rgba(255,255,255,0.3);
      height: 4px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" src="RobinHub.html" title="RobinHub contenido"></iframe>

  <audio id="persistentAudio" preload="auto"></audio>

  <script>
    const playlist = [
      { title: 'Tchaikovsky - El cascanueces', src: './musica-Tchaikovsky-El-cascanueces-Marcha.mp3' },
      { title: 'Chopin - Nocturne Op. 9 No. 2', src: './Classicals.de - Chopin - Nocturne Op. 9, No. 2 in E-flat major.mp3' },
      { title: 'Liszt - La campanella', src: './daily_download_20250903_128.mp3' },
      { title: 'Shostakóvich - Waltz No. 2', src: './Jazz Suite 2 VI Waltz 2.mp3' },
      { title: 'Tchaikovsky - El lago de los cisnes', src: './musica-Tchaikovsky-El-lago-de-los-cisnes.mp3' },
      { title: 'Debussy - Clair de lune', src: './Claude Debussy - Clair de lune (From Twilight).mp3' }
    ];
    const storageKey = 'robinShellMusicState';
    const audio = document.getElementById('persistentAudio');
    const appFrame = document.getElementById('appFrame');

    let state = { index: 0, time: 0, playing: false };

    function getInitialPath(){ const p = new URLSearchParams(window.location.search).get('path'); return p || 'RobinHub.html'; }

    function loadState(){ try{ const raw = localStorage.getItem(storageKey); if(!raw) return; const parsed = JSON.parse(raw); if(typeof parsed.index==='number') state.index = Math.min(parsed.index, playlist.length-1); if(typeof parsed.time==='number') state.time = parsed.time; if(typeof parsed.playing==='boolean') state.playing = parsed.playing; }catch{} }
    function saveState(){ localStorage.setItem(storageKey, JSON.stringify(state)); }

    let trackTicker = null;

    function addScrollStyles(doc){
      if(!doc || doc.getElementById('shell-scroll-styles')) return;
      const style = doc.createElement('style');
      style.id = 'shell-scroll-styles';
      style.textContent = `
        @keyframes shellTextScroll {
          from { transform: translateX(100%); }
          to { transform: translateX(-100%); }
        }
        .shell-track-outer {
          display: inline-block;
          overflow: hidden;
          width: 12ch;
          white-space: nowrap;
          position: relative;
          vertical-align: middle;
        }
        .shell-track-inner {
          display: inline-block;
          white-space: nowrap;
          color: white !important;
          font-weight: 700;
          animation-iteration-count: infinite;
          animation-timing-function: linear;
          will-change: transform;
        }
        #shell-volume-control {
          -webkit-appearance:none;
          appearance:none;
          width: 100%;
          background: rgba(255,255,255,0.3);
          height: 4px;
          border-radius: 999px;
          outline: none;
          cursor: pointer;
          margin-top: 6px;
        }
        #shell-volume-control::-webkit-slider-thumb {
          -webkit-appearance:none;
          appearance:none;
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: white;
          border: 2px solid #1db954;
          margin-top: -6px;
        }
        #shell-volume-control::-moz-range-thumb {
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: white;
          border: 2px solid #1db954;
          cursor: pointer;
        }
        #shell-volume-control::-moz-range-track {
          background: rgba(255,255,255,0.3);
          height: 4px;
          border-radius: 999px;
        }
      `;
      doc.head.appendChild(style);
    }

    function createTrackText(title){
      const clean = (title || '').trim();
      if(clean.length <= 12) return clean;
      return `${clean} • `;
    }

    function startTrackTicker(title){
      const text = createTrackText(title);
      const doc = getFrameDocument();
      if(doc){
        addScrollStyles(doc);
        const inner = doc.getElementById('shell-track-label');
        if(inner){
          inner.textContent = text;
          if(text.length > 12){
            const duration = Math.max(18, text.length * 0.35);
            inner.style.animationName = 'shellTextScroll';
            inner.style.animationDuration = `${duration}s`;
            inner.style.animationTimingFunction = 'linear';
            inner.style.animationIterationCount = 'infinite';
            inner.style.display = 'inline-block';
          } else {
            inner.style.animationName = 'none';
          }
        }
      }
      if(fallbackEl){
        const fbLbl = fallbackEl.querySelector('.shell-track');
        if(fbLbl){
          fbLbl.textContent = title;
        }
      }
    }

    function updateTrackLabel(){
      const track = playlist[state.index] || playlist[0];
      const text = createTrackText(track.title || '');
      document.title = `Shell — ${track.title}`;
      const doc = getFrameDocument();
      if(doc){
        const inner = doc.getElementById('shell-track-label');
        if(inner){
          inner.textContent = text;
        }
      }
      if(fallbackEl){
        const fbLbl = fallbackEl.querySelector('.shell-track');
        if(fbLbl){
          fbLbl.textContent = track.title || '';
        }
      }
    }

    function updateUI(){
      try{
        const doc = getFrameDocument();
        if(doc){
          const pb = doc.getElementById('shell-play-btn');
          if(pb) pb.textContent = audio.paused ? '▶️' : '⏸️';
        }
      }catch{}
      if(fallbackEl){
        const fbBtn = fallbackEl.querySelector('button');
        if(fbBtn) fbBtn.textContent = audio.paused ? '▶️' : '⏸️';
      }
    }

    function setTrack(index, resetTime=true){ state.index = Math.max(0, Math.min(index, playlist.length-1)); if(resetTime) state.time = 0; audio.src = playlist[state.index].src; audio.load(); if(!resetTime && state.time>0) audio.currentTime = Math.min(state.time, audio.duration || state.time); saveState(); startTrackTicker(playlist[state.index]?.title || ''); updateUI(); }

    function playPause(){ if(audio.paused) audio.play().catch(()=>{}); else audio.pause(); }

    audio.addEventListener('play', ()=>{ state.playing = true; saveState(); updateUI(); });
    audio.addEventListener('pause', ()=>{ state.playing = false; saveState(); updateUI(); });
    audio.addEventListener('timeupdate', ()=>{ state.time = audio.currentTime; saveState(); });
    audio.addEventListener('ended', ()=>{ const nextIndex = state.index < playlist.length - 1 ? state.index + 1 : 0; setTrack(nextIndex); audio.play().catch(()=>{}); });

    function getFrameDocument(){ try{ return appFrame.contentDocument || appFrame.contentWindow.document; }catch{return null;} }

    function getFrameLocation(){ try{ const href = appFrame.contentWindow.location.href; const url = new URL(href); return url.pathname.replace(/^\//,'') + url.search + url.hash; }catch{return null;} }

    function isExcludedShellPage(path){
      if(!path) return false;
      const normalized = path.toLowerCase().split('?')[0].split('#')[0];
      return normalized.endsWith('robinhub.html') || normalized.endsWith('login.html') || normalized.endsWith('registro.html');
    }

    function removeShellControls(){
      try{
        const doc = getFrameDocument();
        if(doc){ const existing = doc.getElementById('shell-controls'); if(existing) existing.remove(); }
      }catch{}
      removeFallbackControls();
    }

    function interceptLinks(){ const doc = getFrameDocument(); if(!doc || doc.body.dataset.linkInterceptorAttached) return; doc.body.dataset.linkInterceptorAttached = 'true'; doc.addEventListener('click', event=>{ const anchor = event.target.closest('a[href]'); if(!anchor) return; const href = anchor.getAttribute('href'); if(!href) return; if(href.startsWith('mailto:')||href.startsWith('tel:')) return; if(anchor.target && anchor.target !== '_self') return; try{ const base = new URL(appFrame.contentWindow.location.href); const next = new URL(href, base); if(next.origin !== window.location.origin) return; if(!next.pathname.endsWith('.html')) return; event.preventDefault(); const nextPath = next.pathname.replace(/^\//,'') + next.search + next.hash; appFrame.src = nextPath; history.pushState({path: nextPath}, '', '?path=' + encodeURIComponent(nextPath)); }catch(e){} }); }

    function attemptInjectControls(){
      const doc = getFrameDocument();
      removeShellControls();
      const currentPath = getFrameLocation() || getInitialPath();
      if(isExcludedShellPage(currentPath)){
        return;
      }
      if(!doc){ createFallbackControls(); return; }
      try{
        const navTop = doc.querySelector('.nav-top');
        if(!navTop){ createFallbackControls(); return; }
        if(doc.getElementById('shell-controls')) return;

        const controlsWrapper = navTop.querySelector('.controls-wrapper');

        navTop.style.position = 'relative';
        const ctr = doc.createElement('div');
        ctr.id = 'shell-controls';
        ctr.style.cssText = 'position:absolute;left:calc(5% + 220px);top:50%;transform:translateY(-50%);display:flex;gap:10px;align-items:center;';

        const playBtn = doc.createElement('button');
        playBtn.type = 'button';
        playBtn.id = 'shell-play-btn';
        playBtn.style.background = '#1db954';
        playBtn.style.color = 'white';
        playBtn.style.border = 'none';
        playBtn.style.padding = '8px 12px';
        playBtn.style.borderRadius = '999px';
        playBtn.style.fontWeight = '700';
        playBtn.textContent = audio.paused ? '▶️' : '⏸️';

        const trackOuter = doc.createElement('span');
        trackOuter.className = 'shell-track-outer';
        trackOuter.style.marginLeft = '8px';
        trackOuter.style.display = 'inline-block';
        trackOuter.style.overflow = 'hidden';
        trackOuter.style.width = '12ch';
        trackOuter.style.whiteSpace = 'nowrap';

        const trackLabel = doc.createElement('span');
        trackLabel.id = 'shell-track-label';
        trackLabel.className = 'shell-track-inner';
        trackLabel.style.color = 'white';
        trackLabel.style.display = 'inline-block';
        trackLabel.style.paddingRight = '1ch';
        trackLabel.textContent = playlist[state.index]?.title || '';

        trackOuter.appendChild(trackLabel);

        const trackBox = doc.createElement('div');
        trackBox.style.display = 'flex';
        trackBox.style.flexDirection = 'column';
        trackBox.style.alignItems = 'flex-start';
        trackBox.style.marginLeft = '8px';
        trackBox.appendChild(trackOuter);

        const volumeControl = doc.createElement('input');
        volumeControl.type = 'range';
        volumeControl.id = 'shell-volume-control';
        volumeControl.min = '0';
        volumeControl.max = '100';
        volumeControl.value = '70';
        volumeControl.addEventListener('input', (e) => { audio.volume = e.target.value / 100; });
        trackBox.appendChild(volumeControl);

        ctr.appendChild(playBtn);
        ctr.appendChild(trackBox);

        if(controlsWrapper){
          navTop.insertBefore(ctr, controlsWrapper);
        } else {
          navTop.appendChild(ctr);
        }

        playBtn.addEventListener('click', ()=>{ playPause(); updateUI(); });

        audio.addEventListener('play', ()=>{ try{ playBtn.textContent = '⏸️'; }catch{} updateUI(); });
        audio.addEventListener('pause', ()=>{ try{ playBtn.textContent = '▶️'; }catch{} updateUI(); });

      }catch(e){ createFallbackControls(); }
    }

    let fallbackEl = null;
    function createFallbackControls(){
      if(fallbackEl) return;
      fallbackEl = document.createElement('div');
      fallbackEl.className = 'shell-fallback-controls';
      const b1 = document.createElement('button');
      b1.type='button';
      b1.style.background = '#1db954';
      b1.style.color = 'white';
      b1.style.border = 'none';
      b1.style.padding = '6px 10px';
      b1.style.borderRadius = '6px';
      b1.textContent = audio.paused ? '▶️' : '⏸️';
      b1.addEventListener('click', ()=>{ playPause(); updateUI(); });

      const lbl = document.createElement('span');
      lbl.className = 'shell-track';
      lbl.style.marginLeft = '8px';
      lbl.style.fontWeight = '600';
      lbl.style.color = 'white';
      lbl.textContent = playlist[state.index]?.title || '';

      const volumeControl = document.createElement('input');
      volumeControl.type = 'range';
      volumeControl.id = 'volumeControl';
      volumeControl.min = '0';
      volumeControl.max = '100';
      volumeControl.value = '70';
      volumeControl.style.marginLeft = '12px';
      volumeControl.style.cursor = 'pointer';
      volumeControl.addEventListener('input', (e) => { audio.volume = e.target.value / 100; });

      fallbackEl.appendChild(b1);
      fallbackEl.appendChild(lbl);
      fallbackEl.appendChild(volumeControl);
      document.body.appendChild(fallbackEl);
      audio.addEventListener('play', ()=>{ if(b1) b1.textContent='⏸️'; updateUI(); });
      audio.addEventListener('pause', ()=>{ if(b1) b1.textContent='▶️'; updateUI(); });
      audio.volume = 0.7;
    }
    function removeFallbackControls(){ if(fallbackEl){ try{ fallbackEl.remove(); }catch{} fallbackEl = null; } }

    appFrame.addEventListener('load', ()=>{ try{ interceptLinks(); }catch{} attemptInjectControls(); startTrackTicker(playlist[state.index]?.title || ''); updateShellTitle(); });

    function updateShellTitle(){ const doc = getFrameDocument(); if(!doc) return; const title = doc.title || 'RobinHub'; document.title = `Shell — ${title}`; }

    window.addEventListener('popstate', event=>{ const path = event.state?.path || getInitialPath(); if(appFrame.src.endsWith(path)) return; appFrame.src = path; });

    audio.volume = 0.7; loadState(); const initialPath = getInitialPath(); appFrame.src = initialPath; history.replaceState({path: initialPath}, '', '?path=' + encodeURIComponent(initialPath)); setTrack(state.index, false); if(state.playing) audio.play().catch(()=>{}); updateUI();
    setTimeout(()=>{ attemptInjectControls(); }, 350);
  </script>
</body>
</html>
